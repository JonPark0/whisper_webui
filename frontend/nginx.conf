# Production frontend (FRONTEND_MODE=prod): serves the Vite build and proxies
# the API to the backend, mirroring the dev server's proxy in vite.config.js.
server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving per request (proxy_pass with a variable)
    # keeps the proxy working after the backend container is recreated with a
    # new IP, and lets nginx start even while the backend is still down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Upload size is enforced by the backend (MAX_FILE_SIZE); don't cap it here
    # too, or the two limits drift. Stream the body instead of spooling it.
    client_max_body_size 0;
    proxy_request_buffering off;

    location ~ ^/(api/|docs(/|$)|openapi\.json$) {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Hashed build output: safe to cache for good
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes such as /jobs/:id fall back to the app shell.
    # index.html itself is never cached so a rebuild shows up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
