services:
  redis:
    image: redis:7-alpine
    container_name: whisper_redis
    # No published port: only backend and celery_worker use it, over
    # whisper_network. It has no password, so publishing 6379 would open it to
    # the whole LAN.
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - whisper_network
    command: redis-server --appendonly yes

  backend:
    # Built and published by .github/workflows/image.yml; `docker compose pull`
    # fetches it. IMAGE_TAG=sha-<commit> runs an earlier build. To build from
    # this checkout instead (development), see docker-compose.override.yml.example.
    image: ghcr.io/jonpark0/whisper_webui-backend:${IMAGE_TAG:-main}
    container_name: whisper_backend
    user: "1000:1000"  # Run as non-root user
    ports:
      # The UI reaches the API through the frontend's /api proxy, so the backend
      # only listens on this machine. BACKEND_BIND=0.0.0.0 opens it to the LAN.
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
      - models:/app/models
      - data:/app/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - RELOAD_MODE=${RELOAD_MODE:-false}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - whisper_network

  celery_worker:
    image: ghcr.io/jonpark0/whisper_webui-backend:${IMAGE_TAG:-main}
    container_name: whisper_celery_worker
    user: "1000:1000"  # Run as non-root user
    ipc: host  # Use host IPC for shared memory (required for PyTorch)
    ulimits:
      memlock: -1
      stack: 67108864
    command: celery -A celery_app worker --loglevel=info --pool=solo --concurrency=1
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
      - models:/app/models
      - data:/app/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - C_FORCE_ROOT=false  # Disable Celery root warning
      # PyTorch CUDA memory management optimizations
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - CUDA_LAUNCH_BLOCKING=0
    depends_on:
      - redis
      - backend
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - whisper_network

  frontend:
    # Production build: static files served by nginx, which proxies /api to the
    # backend. The Vite dev server is in docker-compose.override.yml.example.
    image: ghcr.io/jonpark0/whisper_webui-frontend:${IMAGE_TAG:-main}
    container_name: whisper_frontend
    ports:
      # Open to the LAN: http://<server-LAN-IP>:5173. FRONTEND_BIND=127.0.0.1
      # keeps it to this machine.
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - whisper_network

volumes:
  uploads:
  outputs:
  models:
  data:
  redis_data:

networks:
  whisper_network:
    driver: bridge
